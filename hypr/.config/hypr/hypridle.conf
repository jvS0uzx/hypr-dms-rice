# Os comandos hyprctl usam expressão Lua: a configuração do Hyprland é Lua
# desde 01/10/2026. O formato deste arquivo (do hypridle) não mudou.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend só no 30min — notebook com Docker rodando não pode dormir cedo demais.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
