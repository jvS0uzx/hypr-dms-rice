source = ~/.config/hypr/hyprlock-colors.conf

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $lock_accent
    inner_color = $lock_bg
    font_color = $lock_text
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">senha</span>
    check_color = $lock_accent
    fail_color = $lock_error
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $lock_text
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $lock_text
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
