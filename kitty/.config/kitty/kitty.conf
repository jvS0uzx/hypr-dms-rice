font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        12.0
modify_font      cell_height 110%

background_opacity   0.93
background_blur      32
window_padding_width 12
confirm_os_window_close 0

# Decoração da janela depende do ambiente: o Hyprland não tem barra de título
# (fecha com Super+X), mas no Plasma tirar a decoração some com o botão de
# fechar. XDG_CURRENT_DESKTOP vale "Hyprland" ou "KDE".
include desktop-${XDG_CURRENT_DESKTOP}.conf
window_border_width     0
cursor_trail            3
cursor_shape            beam

scrollback_lines 10000
enable_audio_bell no
tab_bar_edge     top
tab_bar_style    powerline
tab_powerline_style slanted

# Desligado: com "yes", qualquer processo da sessão pode mandar o kitty
# digitar e executar comandos. Nada no rice usa — as cores recarregam por
# SIGUSR1 (ver o post_hook do matugen).
allow_remote_control no
shell_integration enabled

# cores vêm do matugen; o arquivo é regravado a cada troca de wallpaper
include colors.conf
